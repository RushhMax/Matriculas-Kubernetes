apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress.yaml

namespace: unsa-matricula

images:
  - name: unsa-matricula-backend
    newName: 455290382075.dkr.ecr.us-east-1.amazonaws.com/unsa-matricula-backend
    newTag: f8b204aa55aee5d331863ade0a9bdf7289388070

  - name: unsa-matricula-frontend
    newName: 455290382075.dkr.ecr.us-east-1.amazonaws.com/unsa-matricula-frontend
    newTag: f8b204aa55aee5d331863ade0a9bdf7289388070

patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ecr-pull

  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ecr-pull

