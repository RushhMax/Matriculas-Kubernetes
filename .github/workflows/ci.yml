name: Quality, ECR and EKS

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT: '455290382075'

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: matricula
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: matricula_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U matricula -d matricula_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Lint
        run: |
          npm --prefix backend run lint
          npm --prefix frontend run lint
      - name: Unit tests
        run: |
          npm --prefix backend test
          npm --prefix frontend test
      - name: PostgreSQL and Redis integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USER: matricula
          DB_PASSWORD: test-only-password
          DB_NAME: matricula_test
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          REDIS_DB: '15'
          ALLOW_TEST_DB_RESET: 'yes'
        run: npm --prefix backend run test:integration
      - name: Frontend production build and Compose validation
        run: |
          npm --prefix frontend run build
          docker compose config --quiet
          docker compose -f compose.test.yml config --quiet
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/reports/
            backend/coverage/
            frontend/reports/
          if-no-files-found: warn

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
      - name: Format and validate without applying infrastructure
        working-directory: infrastructure
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  images:
    needs: [quality, terraform]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build versioned container
        run: |
          docker build --build-arg APP_VERSION="${{ github.sha }}" \
            -t "unsa-matricula-${{ matrix.component }}:${{ github.sha }}" \
            "./${{ matrix.component }}"
      - name: Configure temporary Academy credentials
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT }}
      - name: Login to ECR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: aws-actions/amazon-ecr-login@v2
      - name: Publish image and save its digest
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          COMPONENT: ${{ matrix.component }}
          TAG: ${{ github.sha }}
        run: |
          REPOSITORY="unsa-matricula-$COMPONENT"
          IMAGE="$AWS_ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/$REPOSITORY:$TAG"
          aws ecr describe-repositories --repository-names "$REPOSITORY" >/dev/null
          docker tag "$REPOSITORY:$TAG" "$IMAGE"
          docker push "$IMAGE"
          DIGEST=$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=$TAG" --query 'imageDetails[0].imageDigest' --output text)
          mkdir -p artifacts
          printf '%s\nDigest: %s\n' "$IMAGE" "$DIGEST" | tee "artifacts/ecr-$COMPONENT.txt"
          cat "artifacts/ecr-$COMPONENT.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        with:
          name: ecr-${{ matrix.component }}
          path: artifacts/

  deploy:
    needs: images
    if: vars.ENABLE_EKS_DEPLOY == 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT }}
      - name: Select kubectl matching the cluster version
        id: kubectl-version
        run: |
          MINOR=$(aws eks describe-cluster --name unsa-matricula-dev-cluster --query 'cluster.version' --output text)
          VERSION=$(curl -fsSL "https://dl.k8s.io/release/stable-$MINOR.txt")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: azure/setup-kubectl@v4
        with:
          version: ${{ steps.kubectl-version.outputs.version }}
      - name: Connect to the existing cluster
        run: aws eks update-kubeconfig --region us-east-1 --name unsa-matricula-dev-cluster
      - name: Deploy pinned release and run smoke test
        run: python3 scripts/deploy-ecr.py --tag "${{ github.sha }}" --deploy
